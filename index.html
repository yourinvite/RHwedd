<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Rafli & Hanifah</title>
    <style>
        /* Menghilangkan semua space kosong */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff; 
        }

        /* Container Canva: Memaksa Full Screen Seluler */
        .canva-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* Memastikan Iframe memenuhi layar tanpa scroll luar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Overlay Pintu Masuk */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
        }

        .btn-open {
            padding: 15px 40px;
            font-size: 18px;
            background: #8a704d;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: sans-serif;
            margin-top: 20px;
        }

        /* Tombol Musik Melayang */
        #music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(138, 112, 77, 0.9);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            cursor: pointer;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .spin { animation: rotation 4s linear infinite; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="overlay">
        <p style="font-family: serif; color: #8a704d;">The Wedding of</p>
        <h1 style="font-family: serif; margin: 10px 0 25px;">Rafli & Hanifah</h1>
        <button class="btn-open" onclick="mulaiUndangan()">Buka Undangan</button>
    </div>

    <div class="canva-container">
        <iframe src="https://www.canva.com/design/DAHBpKCi1eo/RcU4abSDygZz_4SLuKkA4A/view?embed" allow="autoplay"></iframe>
    </div>

    <div id="music-btn" onclick="toggleAudio()">🎵</div>

    <audio id="undanganAudio" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('undanganAudio');
        const btn = document.getElementById('music-btn');
        const overlay = document.getElementById('overlay');

        function mulaiUndangan() {
            // Hilangkan overlay
            overlay.style.display = 'none';

            // Paksa putar audio
            audio.play().then(() => {
                btn.style.display = 'flex';
                btn.classList.add('spin');
            }).catch(err => {
                console.log("Audio gagal: ", err);
                btn.style.display = 'flex'; // Tetap munculkan tombol agar user bisa klik sendiri
            });
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('spin');
            } else {
                audio.pause();
                btn.classList.remove('spin');
            }
        }
    </script>
</body>
</html>
