<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-maroon: #800000;
            --soft-pink: #fce4ec;
            --accent-pink: #f06292;
            --white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
            background: #000; /* Latar hitam agar tidak kaget saat video load */
            color: var(--white);
            overflow-x: hidden;
        }

        .section {
            position: relative;
            width: 100%;
            height: 100vh; /* Diubah ke 100vh agar pas layar penuh */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .video-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            object-fit: content; 
            z-index: 1;
            background: #000;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2; 
        }

        .content {
            position: relative;
            z-index: 10;
            width: 90%;
        }

        #namaTamu {
            font-family: 'Pinyon Script', cursive;
            font-size: 2.8rem; 
            margin: 10px 0 25px 0;
            color: var(--soft-pink);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .btn {
            background: var(--primary-maroon);
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Loading Screen agar tidak layar hitam polos */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: 0.5s;
        }

        #cover {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; 
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }
        
        .hidden { transform: translateY(-100%); pointer-events: none; }

        #rsvp-section {
            background: #fffafa;
            height: auto;
            min-height: 100vh;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .rsvp-box {
            background: var(--soft-pink);
            padding: 20px;
            border-radius: 15px;
            max-width: 330px;
            width: 85%;
            border: 2px solid var(--primary-maroon);
        }

        input, select, textarea {
            width: 100%; padding: 10px; margin: 8px 0;
            border-radius: 8px; border: 1px solid var(--accent-pink);
            box-sizing: border-box;
        }

        #guestbook {
            margin-top: 15px; max-height: 250px; overflow-y: auto;
            text-align: left; background: rgba(255,255,255,0.6);
            padding: 10px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loader"><p style="color:white; font-size: 0.8rem;">MEMUAT UNDANGAN...</p></div>

    <audio id="audio" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <section class="section" id="cover">
        <video id="videoCover" class="video-bg" autoplay muted loop playsinline preload="auto">
            <source src="halamandepan.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="content">
            <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.8;">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
            <h1 id="namaTamu">Tamu Undangan</h1>
            <button class="btn" onclick="startApp()">BUKA UNDANGAN</button>
        </div>
    </section>

    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="sampul.mp4" type="video/mp4"></video></section>
    <section class="section">
        <video class="video-bg" autoplay muted loop playsinline><source src="Tanggal.mp4" type="video/mp4"></video>
        <div class="content"><a href="http://maps.google.com" target="_blank" class="btn">KLIK LOKASI</a></div>
    </section>
    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="kisah1.mp4" type="video/mp4"></video></section>
    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="kisah2.mp4" type="video/mp4"></video></section>
    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="galeri.mp4" type="video/mp4"></video></section>
    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="prewed.mp4" type="video/mp4"></video></section>
    <section class="section"><video class="video-bg" autoplay muted loop playsinline><source src="Amplop.mp4" type="video/mp4"></video></section>

    <section id="rsvp-section">
        <div class="rsvp-box">
            <h2 style="color: var(--primary-maroon);">RSVP & Ucapan</h2>
            <input type="text" id="nama" placeholder="Nama Anda">
            <select id="status">
                <option value="Hadir">Saya Akan Hadir</option>
                <option value="Tidak Hadir">Berhalangan Hadir</option>
            </select>
            <textarea id="pesan" rows="3" placeholder="Tulis Ucapan..."></textarea>
            <button class="btn" style="width:100%" onclick="sendRSVP()">KIRIM</button>
            <div id="guestbook">
                <div id="no-msg" style="text-align:center; opacity:0.5;"><i>Belum ada ucapan.</i></div>
            </div>
        </div>
    </section>

    <script>
        // Sembunyikan Loader saat video cover sudah bisa diputar
        const vCover = document.getElementById('videoCover');
        vCover.oncanplaythrough = function() {
            document.getElementById('loader').style.opacity = "0";
            setTimeout(() => { document.getElementById('loader').style.display = "none"; }, 500);
        };

        // Jika dalam 5 detik video belum load, paksa hilangkan loader agar tamu tetap bisa buka
        setTimeout(() => { document.getElementById('loader').style.display = "none"; }, 5000);

        const params = new URLSearchParams(window.location.search);
        let namaTampil = "Tamu Undangan";

        const daftarTamu = ["Dahlia & Partner","Nila","Khafi","Puji","Dea","Elsa","Dinda","Arni","Selsa","Aril","Dimas","Ulil","Haris","Adhi","Nazar","Riska","Julia","Dimas","Apitri","Hepi","Haris","Happy","Vina","Defiatun","Evelyn","Devy Chusna","Uswatun","Rinanda","Widya","Fatma","Ana","Siska","Maziyah","Tasya","Nanda","Latifa","Putri","Isna","Lina","Nurhid","Fera","Yunita","Khoirina","Liyah","Eka","Anom","Arif","Agus","Anam","Risky","Fifi","Anggun","Nadia","Nadia","Rifky","Ryan","Wildan","Wisnu","David","Sandi","Zubaedi","Vina","Dennis","Asri","Najih","Fidia","Galang & Octa","Ashar","Isa Dewo","Mubin","Dila","Yaqin","Alvian","Agus","Lutfi","Meyta","Adam","Eli","Feri","Basyid","Nova","Itoul","zubaedi","Yogi","Nafa","Imam","Jaya","Jihan","Firman","Lintang","Tika","Fajrika","Bapak Nanang Apriliyanto","Bapak Gilang Kharisma Putra","Ibu Siti Abdillah","Ibu Eka Kurnia","Ibu Fitria Yuni","Zul","Wis","Viza","Amel","Novika","Sudirman","Bunda Novi","Bunda Imroatul","Ibu Milka","Ibu Tata","Wahyu","Jian","Fatoni","Anang","Riski dwi","Nopita","Tya","Damia","Erika","Adillia","Silda","Ani","Ani Suryani","Anita","Tsabit","Vella","Usna","Dheny","Dicky","Hana","Faqih","Fika","Gina","Ihan","Khusni","Ali","Leindra","Linda","Meylina","Anang","Nuria","Ridwan","Yasinta","Syifa","Ulil","Alif","Alina","SD N Pojoksari","Rifky","Syifa","Queen","Yunita","Anjar","Yohana","Syamsul","Adam","Marcell","Herlina","Pandu","Efendi","Nadia","Lina","Bobby","Vivi","Greget","Septi","Yunita","Sulis","Wis","Fauzul","Isti","Dwi","Liyak","Heru","Yaya","Nugroho","Dadang","Rofiq","Helmi","Jidan","Aji & Partner","Caca & Partner","Reyhan","Ajat & Erliza","Nurom","bintang","Esthiana","Susi","Dhita","Alumni XII RPL 1","Alumni Bantara Angkatan 14"];

        if (params.get('to')) {
            namaTampil = decodeURIComponent(params.get('to')).replace(/\+/g, ' ');
        } else if (params.get('id')) {
            const index = parseInt(params.get('id')) - 1;
            if (daftarTamu[index]) namaTampil = daftarTamu[index];
        }

        namaTampil = namaTampil.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        document.getElementById('namaTamu').innerText = namaTampil;
        document.getElementById('nama').value = namaTampil;

        function startApp() {
            document.getElementById('audio').play();
            document.getElementById('cover').classList.add('hidden');
            document.body.style.overflow = "auto";
            
            // Geser sedikit ke bawah ke video selanjutnya otomatis
            setTimeout(() => {
                window.scrollBy({ top: 10, behavior: 'smooth' });
            }, 1000);
        }

        function sendRSVP() {
            const nama = document.getElementById('nama').value;
            const status = document.getElementById('status').value;
            const pesan = document.getElementById('pesan').value;
            if(!nama || !pesan) { alert("Lengkapi data ya!"); return; }
            const gb = document.getElementById('guestbook');
            const noMsg = document.getElementById('no-msg');
            if(noMsg) noMsg.remove();
            const div = document.createElement('div');
            div.style.padding = "8px 0";
            div.style.borderBottom = "1px solid var(--accent-pink)";
            div.innerHTML = `<b>${nama}</b> <small>(${status})</small><br>${pesan}`;
            gb.prepend(div);
            document.getElementById('pesan').value = "";
        }
    </script>
</body>
</html>
