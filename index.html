<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Pernikahan Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-maroon: #800000;
            --soft-pink: #fce4ec;
            --accent-pink: #f06292;
            --light-purple: #a4509b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: var(--white);
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

#cover {  
        position: fixed;  
        top: 0; left: 0;  
        width: 100%; height: 100vh;  
        background: #000;  
        z-index: 9999;  
        display: flex;  
        flex-direction: column;  
        justify-content: center;  
        align-items: center;  
        text-align: center;  
        transition: 1s ease-in-out;  
    }  

    .hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

    .section {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
/* Tambahkan ini untuk menghilangkan celah antar section */
margin-bottom: -1px;
}
video {
    width: 100%;
    height: 100%;
    /* Gunakan cover agar tidak ada sela hitam di pinggir */
    object-fit: cover; 
    display: block;
}

        .overlay-content {
            position: absolute;
            z-index: 10;
            width: 100%;
            text-align: center;
        }

        .btn {
            background: var(--primary-maroon);
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Samakan Ukuran Tombol Konfirmasi */
        .wa-container {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            width: 100%;
            align-items: center;
        }

        .btn-wa {
            background: var(--light-purple);
            color: white;
            padding: 12px 5px;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.7rem; /* Ukuran font sedikit kecil agar satu baris */
            width: 200px; /* Lebar tombol dikunci agar sama */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap; /* Paksa teks satu baris */
        }

        #rsvp-section {
            background: #fffafa;
            padding: 50px 0;
            display: flex;
            justify-content: center;
            color: #333;
        }

        .rsvp-box {
            background: var(--soft-pink);
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            border: 2px solid var(--primary-maroon);
        }

        input, select, textarea {
            width: 100%; padding: 10px; margin: 10px 0;
            border-radius: 8px; border: 1px solid #ccc;
        }
    </style>
</head>
<body style="overflow: hidden;"> 
    <audio id="audio" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <div id="cover">
        <video autoplay muted loop playsinline><source src="halamandepan.mp4" type="video/mp4"></video>
        <div class="overlay-content">
            <p style="font-size: 0.9rem;">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
            <h1 id="namaTamu" style="font-family: 'Pinyon Script'; font-size: 2.8rem; color: var(--soft-pink);">Tamu Undangan</h1>
            <button class="btn" onclick="startApp()">BUKA UNDANGAN</button>
        </div>
    </div>

    <div id="wrapper">
        <div class="section"><video autoplay muted loop playsinline><source src="sampul.mp4" type="video/mp4"></video></div>

        <div class="section">
            <video autoplay muted loop playsinline><source src="Tanggal.mp4" type="video/mp4"></video>
            <div class="overlay-content">
                <a href="https://maps.google.com" target="_blank" class="btn">KLIK LOKASI</a>
            </div>
        </div>

        <div class="section"><video autoplay muted loop playsinline><source src="bridegroom.mp4" type="video/mp4"></video></div>
        <div class="section"><video autoplay muted loop playsinline><source src="kisah1.mp4" type="video/mp4"></video></div>
        <div class="section"><video autoplay muted loop playsinline><source src="galeri.mp4" type="video/mp4"></video></div>
        <div class="section"><video autoplay muted loop playsinline><source src="prewed.mp4" type="video/mp4"></video></div>

        <div class="section">
            <video autoplay muted loop playsinline><source src="Amplop.mp4" type="video/mp4"></video>
            <div class="wa-container">
                <a href="https://wa.me/6289518680371" target="_blank" class="btn-wa">Konfirmasi Pria</a>
                <a href="https://wa.me/6289652710801" target="_blank" class="btn-wa">Konfirmasi Wanita</a>
            </div>
        </div>

        <div id="rsvp-section">
            <div class="rsvp-box">
                <h2 style="color: var(--primary-maroon); text-align: center;">RSVP & Ucapan</h2>
                <input type="text" id="nama" placeholder="Nama Anda">
                <select id="status">
                    <option value="Hadir">Saya Akan Hadir</option>
                    <option value="Tidak Hadir">Berhalangan Hadir</option>
                </select>
                <textarea id="pesan" rows="3" placeholder="Tulis Ucapan..."></textarea>
                <button class="btn" style="width:100%" onclick="alert('Ucapan terkirim!')">KIRIM</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let namaTampil = "Tamu Undangan";
        const daftarTamu = ["Dahlia & Partner","Nila","Khafi","Puji","Dea","Elsa","Dinda","Arni","Selsa","Aril","Dimas","Ulil","Haris","Adhi","Nazar","Riska","Julia","Dimas","Apitri","Hepi","Haris","Happy","Vina","Defiatun","Evelyn","Devy Chusna","Uswatun","Rinanda","Widya","Fatma","Ana","Siska","Maziyah","Tasya","Nanda","Latifa","Putri","Isna","Lina","Nurhid","Fera","Yunita","Khoirina","Liyah","Eka","Anom","Arif","Agus","Anam","Risky","Fifi","Anggun","Nadia","Nadia","Rifky","Ryan","Wildan","Wisnu","David","Sandi","Zubaedi","Vina","Dennis","Asri","Najih","Fidia","Galang & Octa","Ashar","Isa Dewo","Mubin","Dila","Yaqin","Alvian","Agus","Lutfi","Meyta","Adam","Eli","Feri","Basyid","Nova","Itoul","zubaedi","Yogi","Nafa","Imam","Jaya","Jihan","Firman","Lintang","Tika","Fajrika","Bapak Nanang Apriliyanto","Bapak Gilang Kharisma Putra","Ibu Siti Abdillah","Ibu Eka Kurnia","Ibu Fitria Yuni","Zul","Wis","Viza","Amel","Novika","Sudirman","Bunda Novi","Bunda Imroatul","Ibu Milka","Ibu Tata","Wahyu","Jian","Fatoni","Anang","Riski dwi","Nopita","Tya","Damia","Erika","Adillia","Silda","Ani","Ani Suryani","Anita","Tsabit","Vella","Usna","Dheny","Dicky","Hana","Faqih","Fika","Gina","Ihan","Khusni","Ali","Leindra","Linda","Meylina","Anang","Nuria","Ridwan","Yasinta","Syifa","Ulil","Alif","Alina","SD N Pojoksari","Rifky","Syifa","Queen","Yunita","Anjar","Yohana","Syamsul","Adam","Marcell","Herlina","Pandu","Efendi","Nadia","Lina","Bobby","Vivi","Greget","Septi","Yunita","Sulis","Wis","Fauzul","Isti","Dwi","Liyak","Heru","Yaya","Nugroho","Dadang","Rofiq","Helmi","Jidan","Aji & Partner","Caca & Partner","Reyhan","Ajat & Erliza","Nurom","bintang","Esthiana","Susi","Dhita","Alumni XII RPL 1","Alumni Bantara Angkatan 14"];

        if (params.get('to')) {
            namaTampil = decodeURIComponent(params.get('to')).replace(/\+/g, ' ');
        } else if (params.get('id')) {
            const index = parseInt(params.get('id')) - 1;
            if (daftarTamu[index]) namaTampil = daftarTamu[index];
        }

        namaTampil = namaTampil.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        document.getElementById('namaTamu').innerText = namaTampil;
        document.getElementById('nama').value = namaTampil;

        function startApp() {
            document.getElementById('audio').play();
            document.getElementById('cover').classList.add('hidden');
            document.body.style.overflow = "auto";
        }
    </script>
</body>
</html>
