<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Rafli & Hanifah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #fff; 
        }

        /* Container utama untuk memotong bagian yang keluar layar */
        .outer-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Trik Zoom: Memperbesar iframe agar navigasi & bar hitam terpotong */
        iframe {
            position: absolute;
            width: 100%;
            height: 115%; /* Dibuat lebih tinggi untuk buang navigasi bawah */
            top: -5%;     /* Geser ke atas untuk buang bar atas */
            left: 0;
            border: none;
            /* Transform scale jika masih ada sisa hitam di samping */
            transform: scale(1.05); 
            transform-origin: top center;
        }

        /* Tombol Buka Undangan */
        #pintu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .btn-buka {
            padding: 15px 40px; border-radius: 50px; border: none;
            background: #8a704d; color: white; font-size: 18px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Tombol Musik */
        #mu-btn {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(138, 112, 77, 0.9); border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            color: white; z-index: 9999; cursor: pointer; font-size: 24px;
        }
        .spin { animation: rotate 4s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="pintu">
        <h2 style="font-family: serif; color: #8a704d; margin-bottom: 10px;">The Wedding of</h2>
        <h1 style="font-family: serif; margin-bottom: 30px;">Rafli & Hanifah</h1>
        <button class="btn-buka" onclick="start()">Buka Undangan</button>
    </div>

    <div class="outer-wrapper">
        <iframe src="https://www.canva.com/design/DAHBpKCi1eo/RcU4abSDygZz_4SLuKkA4A/view?embed" allow="autoplay"></iframe>
    </div>

    <div id="mu-btn" onclick="toggle()">🎵</div>

    <audio id="lagu" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('lagu');
        const btn = document.getElementById('mu-btn');

        function start() {
            document.getElementById('pintu').style.opacity = '0';
            setTimeout(() => { document.getElementById('pintu').style.display = 'none'; }, 500);
            audio.play();
            btn.style.display = 'flex';
            btn.classList.add('spin');
        }

        function toggle() {
            if (audio.paused) { audio.play(); btn.classList.add('spin'); }
            else { audio.pause(); btn.classList.remove('spin'); }
        }
    </script>
</body>
</html>
