<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Rafli & Hanifah</title>
    <style>
        /* Hilangkan jarak putih di pinggir layar */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }

        /* Layar Pembuka (Overlay) */
        #pintu-masuk {
            position: fixed; width: 100%; height: 100%; background: #ffffff;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999; text-align: center;
            transition: 0.8s ease-in-out;
        }

        .btn-buka {
            padding: 15px 40px; font-size: 18px; cursor: pointer;
            background: #8a704d; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-family: sans-serif;
        }

        /* Container Canva (Full Screen Mobile) */
        .canva-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Tombol Musik Melayang */
        #music-btn {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px;
            background: rgba(138, 112, 77, 0.8); border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            color: white; z-index: 1000; cursor: pointer; font-size: 24px;
        }
        .putar { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="pintu-masuk">
        <h2 style="font-family: serif; color: #8a704d; margin-bottom: 10px;">The Wedding of</h2>
        <h1 style="font-family: serif; margin-bottom: 30px;">Rafli & Hanifah</h1>
        <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
    </div>

    <div class="canva-wrapper">
        <iframe src="https://www.canva.com/design/DAHBpKCi1eo/RcU4abSDygZz_4SLuKkA4A/view?embed" allow="autoplay"></iframe>
    </div>

    <div id="music-btn" onclick="toggleMusik()">🎵</div>

    <audio id="myAudio" loop>
        <source src="Musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('myAudio');
        const overlay = document.getElementById('pintu-masuk');
        const btn = document.getElementById('music-btn');

        function bukaUndangan() {
            // Sembunyikan layar putih
            overlay.style.opacity = '0';
            setTimeout(() => { 
                overlay.style.display = 'none'; 
            }, 800);

            // Putar Musik.mp3
            audio.play().catch(err => {
                console.log("Audio diblokir, butuh klik manual.");
            });

            // Tampilkan tombol musik di pojok
            btn.style.display = 'flex';
            btn.classList.add('putar');
        }

        function toggleMusik() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('putar');
            } else {
                audio.pause();
                btn.classList.remove('putar');
            }
        }
    </script>
</body>
</html>
