<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Rafli & Hanifah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; /* Background hitam agar seamless jika ada jeda loading */
        }

        /* Container Utama */
        .canva-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Memaksa Iframe untuk Full Screen & Menghilangkan Bar Navigasi Canva */
        iframe {
            position: absolute;
            width: 100vw;
            height: 125vh; /* Dibuat lebih tinggi untuk menyembunyikan navigasi bawah Canva */
            top: -5vh; /* Geser sedikit ke atas untuk menyembunyikan bar atas */
            border: none;
        }

        /* Overlay Pembuka */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            transition: 0.5s;
        }

        .btn-open {
            padding: 15px 40px;
            font-size: 18px;
            background: #8a704d;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Tombol Musik Melayang */
        #music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(138, 112, 77, 0.9);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            cursor: pointer;
            font-size: 22px;
        }

        .spin { animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="overlay">
        <p style="font-family: serif; color: #8a704d;">The Wedding of</p>
        <h1 style="font-family: serif; margin: 10px 0 25px;">Rafli & Hanifah</h1>
        <button class="btn-open" onclick="start()">Buka Undangan</button>
    </div>

    <div class="canva-wrapper">
        <iframe src="https://www.canva.com/design/DAHBpKCi1eo/RcU4abSDygZz_4SLuKkA4A/view?embed" allow="autoplay"></iframe>
    </div>

    <div id="music-btn" onclick="toggle()">🎵</div>

    <audio id="audio" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('audio');
        const btn = document.getElementById('music-btn');

        function start() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 500);
            
            audio.play().then(() => {
                btn.style.display = 'flex';
                btn.classList.add('spin');
            }).catch(() => {
                btn.style.display = 'flex';
            });
        }

        function toggle() {
            if (audio.paused) { audio.play(); btn.classList.add('spin'); }
            else { audio.pause(); btn.classList.remove('spin'); }
        }
    </script>
</body>
</html>
