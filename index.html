<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Rafli & Hanifah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: sans-serif; }

        /* Overlay Awal */
        #pintu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .btn-buka {
            padding: 15px 40px; border-radius: 50px; border: none;
            background: #8a704d; color: white; font-size: 18px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Container Canva */
        .wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Tombol Musik */
        #btn-musik {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(138, 112, 77, 0.8); border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            color: white; z-index: 1000; cursor: pointer; font-size: 24px;
        }
        .putar { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="pintu">
        <h2 style="margin-bottom: 20px;">The Wedding of</h2>
        <h1 style="margin-bottom: 30px;">Rafli & Hanifah</h1>
        <button class="btn-buka" onclick="start()">Buka Undangan</button>
    </div>

    <div class="wrapper">
        <iframe src="https://www.canva.com/design/DAHBpKCi1eo/RcU4abSDygZz_4SLuKkA4A/view?embed" allow="autoplay"></iframe>
    </div>

    <audio id="lagu" loop>
        <source src="Musik.mp3" type="audio/mpeg">
    </audio>

    <div id="btn-musik" onclick="toggle()">🎵</div>

    <script>
        const audio = document.getElementById('lagu');
        const btn = document.getElementById('btn-musik');

        function start() {
            document.getElementById('pintu').style.display = 'none';
            // Mencoba memutar audio
            audio.play().then(() => {
                btn.style.display = 'flex';
                btn.classList.add('putar');
            }).catch(() => {
                // Jika autoplay diblokir, tetap tampilkan tombol agar bisa klik manual
                btn.style.display = 'flex';
            });
        }

        function toggle() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('putar');
            } else {
                audio.pause();
                btn.classList.remove('putar');
            }
        }
    </script>
</body>
</html>
